# =============================================================================
# mc-test.example.yml — annotated, worked environment matrix for the "regions"
# example (@mc-test/runner package.json calls this out as the template a new
# project starts from; `mc-test init` scaffolds a smaller single-target version
# of the same shape).
# -----------------------------------------------------------------------------
# Spec: docs/ENVIRONMENTS.md. Schema (source of truth — this file has no separate
# JSON Schema): packages/runner/src/model/Target.ts (MatrixFile/MatrixTarget/
# ProvisionPolicy/WorldDef/Source). The parser (packages/runner/src/config/
# loadMatrix.ts) warns at parse time on any key not in that model, so every line
# below is a key the runner actually reads — nothing here is aspirational.
#
# What this matrix does (mirrors the real, CI-run `mc-test.yml` at the repo root):
#   - Stands up the canonical "regions" SUT (a Bukkit plugin AND a Fabric/Forge/
#     NeoForge mod) against Paper, Spigot (old-version), and all three modded
#     loaders — as both a rendered CLIENT and a headless SERVER target.
#   - Runs the SAME semantic test ("join localhost -> /or -> click 'Regions'
#     -> click 'TestRegion' -> assert chat 'Region loaded' AND region exists")
#     against whichever targets you pass on the command line:
#       npx mc-test run examples/regions/regions.mctest.yml --target paper-1.20.4
#       npx mc-test run examples/regions/regions.mctest.yml --target all
#     There is no `suites:`/`matrix:` expansion block — you list target ids
#     explicitly (below) and pick which run with `--target`; each (test × target)
#     cell is negotiated independently via the `requires:` capabilities declared
#     IN THE STEP FILE (see examples/regions/*.mctest.yml), not in this file.
#   - The rendered-client rows honestly SKIP off a display-less/GL-less host
#     (capability negotiation — never a false green); see docs/CI.md for which
#     CI lane actually boots them.
#
# Copy real artifact URLs/sha256 into a `url:`/`sha256:` source before running
# against a remote jar, or point `path:` at a locally-built one (as done below).
# EULA must be accepted (provision.eulaAccepted) — see the troubleshooting table
# in docs/GETTING_STARTED.md if a target fails to boot.
# =============================================================================

version: 1

# -----------------------------------------------------------------------------
# provision — global provisioning policy (ProvisionPolicy in Target.ts).
# -----------------------------------------------------------------------------
provision:
  eulaAccepted: true          # you accept Mojang's EULA by setting this; required to boot
  bindHost: "127.0.0.1"       # loopback only — offline-mode servers must not be public
  portRange: [25700, 25899]   # gamePort + mctpPort (+ a second mctpPort for a co-selected agent)
  cacheDir: "~/.mc-test/cache"
  workDir: ".mc-test/run"
  keepOnFailure: true         # preserve the instance dir + logs when a target's run fails
  keepWorkDir: false          # true retains EVERY run dir (even passing ones) for inspection
  reuse: false                # rapid-dev mode: one stable dir per target id instead of per-run
  shareRuntime: true          # junction the heavy libraries/cache/versions dirs across runs of the same build
  downloadJdks: true          # fetch a matching Temurin JDK into the cache when the host Java doesn't fit

# -----------------------------------------------------------------------------
# worlds — named snapshots, referenced from a target via `world: { ref: <name> }`.
# `snapshot.path` is the only field the provisioner reads (a local, pre-built
# world dir copied per-instance); omit `snapshot` entirely and the server just
# generates its own default world.
# -----------------------------------------------------------------------------
worlds:
  regions-world:
    snapshot: { path: "./examples/regions/world-snapshot" }
    levelName: "world"

# -----------------------------------------------------------------------------
# targets — each entry is one runnable (or honestly-skippable) environment.
# There is no axis-expansion syntax: one MC version × one loader = one target id.
# Every `Source` (server/plugins/mods/loaderInstaller/agentSources entries) is
# resolved by EXACTLY one of `path` (local jar), `url` + `sha256` (downloaded,
# checksum-verified), or `modrinth: { project, version, loader?, gameVersion? }`
# (resolved + verified against Modrinth's published hash) — `server:` additionally
# accepts `paper: { build }` (PaperMC fill API; `mc` drives the version) or
# `spigot: { version }` (built from source via BuildTools, for pre-Paper MC
# versions the fill API doesn't serve).
# -----------------------------------------------------------------------------
targets:

  # ===== PAPER (server-side plugin; headless bot driver) =====================
  - id: paper-1.20.4
    loader: paper
    mc: "1.20.4"
    driver: headless                        # Mineflayer + minecraft-data — chat, commands, inventory GUIs
    server: { paper: { build: latest } }
    plugins:
      - { path: "./examples/regions/plugin/target/regions-plugin.jar", as: "regions.jar" }
    agents: [server-bukkit]                 # co-select the Bukkit truth agent → assertPluginState/fixtures RUN, not skip
    serverProps:
      view-distance: 6
      simulation-distance: 6
      spawn-monsters: false                 # quiet, deterministic test world
    ops: ["mc-test-bot"]                    # the headless bot's join username, op'd for permission-gated commands
    world: { ref: regions-world }

  # ===== OLD-VERSION PAPER (headless; honestly skips without a matching jar) ==
  # The PaperMC fill API has no 1.8.9 build, so this row honestly skips
  # UNSUPPORTED_TARGET as written. `via: true` is advisory — the headless bot's
  # Mineflayer range already spans 1.8, so it connects DIRECTLY; ViaProxy only
  # matters for a version genuinely outside that range. Swap `server:` for the
  # spigot-1.8.8 row below (Spigot's 1.8.x BuildTools rev) to get a REAL boot.
  - id: paper-1.8.9
    loader: paper
    mc: "1.8.9"
    driver: headless
    via: true
    server: { paper: { build: latest } }
    plugins:
      - { path: "./examples/regions/plugin/target/regions-plugin.jar", as: "regions.jar" }
    agents: [server-bukkit]
    world: { ref: regions-world }

  # ===== SPIGOT (old-version, headless; built from source via BuildTools) ====
  - id: spigot-1.8.8
    loader: spigot
    mc: "1.8.8"
    driver: headless
    server: { spigot: { version: "1.8.8" } } # BuildTools rev; the runner fetches a Java 8 JDK for the boot
    plugins:
      - { path: "./examples/regions/plugin/target/regions-plugin.jar", as: "regions.jar" }
    agents: [server-bukkit]
    world: { ref: regions-world }

  # ===== FABRIC (rendered client; in-process client agent) ===================
  - id: fabric-1.21-client
    loader: fabric
    mc: "1.21.1"
    driver: inprocess                       # the ONLY driver that sees real client Screens
    server: { paper: { build: latest } }    # the server the rendered client connects to
    plugins:
      - { path: "./examples/regions/plugin/target/regions-plugin.jar", as: "regions.jar" }
    mods:
      - { path: "./examples/regions/mod-fabric/build/libs/openregions-fabric.jar", as: "regions.jar" }
    display: xvfb                           # "desktop" on a windowed runner; omit to auto-select by platform
    agents: [client-fabric, server-bukkit]  # the rendered-client agent + the Bukkit truth agent (server is Paper)
    world: { ref: regions-world }

  # ===== NEOFORGE (rendered client; in-process client agent) =================
  - id: neoforge-1.21-client
    loader: neoforge
    mc: "1.21.1"
    loaderVersion: "21.1.66"                # REQUIRED for forge/neoforge — pins the modular installer launch
    driver: inprocess
    server: { paper: { build: latest } }
    plugins:
      - { path: "./examples/regions/plugin/target/regions-plugin.jar", as: "regions.jar" }
    mods:
      - { path: "./examples/regions/mod-neoforge/build/libs/openregions-neoforge.jar", as: "regions.jar" }
    display: xvfb
    agents: [client-neoforge, server-bukkit]
    world: { ref: regions-world }

  # ===== FORGE (rendered client; in-process client agent) ====================
  - id: forge-1.20.1-client
    loader: forge
    mc: "1.20.1"
    loaderVersion: "47.3.39"
    driver: inprocess
    server: { paper: { build: latest } }
    plugins:
      - { path: "./examples/regions/plugin/target/regions-plugin.jar", as: "regions.jar" }
    mods:
      - { path: "./examples/regions/mod-forge/build/libs/openregions-forge.jar", as: "regions.jar" }
    display: xvfb
    agents: [client-forge, server-bukkit]
    world: { ref: regions-world }

  # ───────────────────────────── MODDED SERVERS ──────────────────────────────
  # Test SERVER-SIDE mods on a real dedicated Fabric/Forge/NeoForge server (no
  # display — a server renders nothing, so these boot in plain CI). `driver:
  # server` is a server-truth-only session (no player join) — the only way to
  # assert on Forge/NeoForge, whose FML handshake a bot can't complete. Each row
  # installs a REAL third-party mod pulled live from Modrinth (not a fixture) so
  # `mod.loaded` is proving something a stub couldn't fake.
  - id: fabric-server-1.21
    loader: fabric
    mc: "1.21.1"
    loaderVersion: "0.19.3"
    driver: server
    mods:
      - { modrinth: { project: ferrite-core, version: sOzRw3CG }, as: "ferritecore.jar" }
      - { modrinth: { project: fabric-api, loader: fabric, gameVersion: "1.21.1" }, as: "fabric-api.jar" }
    agents: [server-fabric]                 # the Fabric server-mod truth agent → mods/
    expectMods: [ferritecore]               # boot-log gate: fail MOD_NOT_LOADED if the loader didn't load it
    world: { ref: regions-world }

  - id: neoforge-server-1.21
    loader: neoforge
    mc: "1.21.1"
    loaderVersion: "21.1.234"
    driver: server
    mods:
      - { modrinth: { project: ferrite-core, version: x7kQWVju }, as: "ferritecore.jar" }
    agents: [server-neoforge]
    expectMods: [ferritecore]
    world: { ref: regions-world }

  - id: forge-server-1.20.1
    loader: forge
    mc: "1.20.1"
    loaderVersion: "47.3.39"
    driver: server
    mods:
      - { modrinth: { project: ferrite-core, version: DG5Fn9Sz }, as: "ferritecore.jar" }
    agents: [server-forge]
    expectMods: [ferritecore]
    world: { ref: regions-world }
