# mc-test server agent (MCTP) configuration.
# The runner provisions this file as plugins/mc-test-agent/config.yml with the per-target port it
# allocated (distinct from the game port), then learns the bound port from the
# "MCTP listening on :<port>" log line.

# WebSocket port the MCTP server binds. Resolution order: this key when set (the runner's
# provisioning writes it) → the MCTEST_AGENT_PORT env var (spec/42 — how CC's servers module wires
# the sidecar) → 25575. Commented out by default so the env path works out of the box.
#port: 25575

# Bind address. Loopback only by default (CI default; agents bind loopback per PROTOCOL.md §2.1).
host: 127.0.0.1

# Handshake token (spec/42, PROTOCOL.md §4.2). When set (here or via the MCTEST_AGENT_TOKEN env
# var), session.create requires params.auth.token to match; unset/empty = open agent (throwaway
# test instances). A long-lived agent on a server a human plays should always have one.
#token: ""

# Advertise fakePlayers (Carpet backend: dispatches Carpet's /player command). Default OFF —
# plain Paper has no /player, and advertising a capability we cannot honor would turn
# spawnFakePlayer steps into red failures instead of honest skips.
#fakePlayers: false
